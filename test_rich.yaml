# ==============================================================================
# FLUTTER MARKETING KIT CONFIGURATION
# Generated by `dart run flutter_marketing_kit init`
# ==============================================================================

# General Application Information
app_name: Expense AI
package_name: com.example.expense
output_directory: marketing

# Visual Design Theme and Preset
# Supported Themes: modern, minimal, material, gaming, kids, finance, health
theme: modern
template: gaming

# Branding Colors (HEX Format)
primary_color: "#5E5CE6"
accent_color: "#00C2FF"

# Target Devices for Framing and Screenshots
# Phone: pixel9, iphone16, iphone16Pro, iphoneSE, galaxyS25, pixelFold
# Tablet: ipad, ipadAir, ipadPro, galaxyTab
devices:
  - pixel9
  - iphone16
  - ipad

# Localization Locales
languages:
  - en
  - ar

# Target Application Routes & Screenshot Captions
screens:
  home:
    route: /
    title: Smart Dashboard
    subtitle: Track your expenses in real-time
  premium:
    route: /premium
    title: Premium Features
    subtitle: Unlock unlimited budgets & analytics
  settings:
    route: /settings
    title: Seamless Controls
    subtitle: Customize themes, currencies & privacy

# Optional AI Integration Settings
# AI features are 100% optional.
# Supported Providers: gemini, openai, anthropic, openrouter, ollama, lmstudio
ai:
  provider: gemini
  # api_key: "YOUR_API_KEY_HERE"
