name: GitHub Actions Workflow
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          flutter pub get
          npx melos bootstrap

      - name: Analyze Monorepo
        run: npx melos run analyze

      - name: Run Tests
        run: npx melos run test

      - name: Generate Marketing Assets
        run: dart run flutter_marketing_kit generate

      - name: Upload Marketing Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketing-assets
          path: marketing/marketing_assets_bundle.zip
